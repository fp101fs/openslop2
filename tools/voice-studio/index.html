<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenSlop II Voice Studio</title>
<style>
  :root {
    --bg: #0b0f16; --panel: #121925; --panel2: #182233; --line: #243247;
    --text: #dbe6f5; --dim: #7f91ab; --accent: #4cc2ff;
    --terran: #ff9b3d; --protoss: #f2d14b; --zerg: #b46cff; --clean: #8fa3bf;
    --race: var(--accent);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  #status { margin-left: auto; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #e0a030; }
  #status.ready .dot { background: #3ddc84; }
  #status.err .dot { background: #ff5a5a; }
  main { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; color: var(--dim); padding: 10px 0; cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; text-transform: capitalize; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--race); }
  #phrases { overflow-y: auto; padding: 8px 12px 16px; flex: 1; }
  .unit h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 14px 0 6px; display: flex; justify-content: space-between; }
  .unit h3 span { text-transform: none; letter-spacing: 0; opacity: .7; }
  .chip { display: block; width: 100%; text-align: left; background: var(--panel2); border: 1px solid transparent; color: var(--text); padding: 7px 10px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; font: inherit; }
  .chip:hover { border-color: var(--line); }
  .chip.on { border-color: var(--race); box-shadow: inset 3px 0 0 var(--race); }
  .aside-foot { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  section.work { overflow-y: auto; padding: 18px 22px 40px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  textarea { width: 100%; min-height: 76px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 16px/1.4 inherit; }
  textarea:focus, select:focus { outline: 1px solid var(--race); }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  label.f { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  input[type=range] { accent-color: var(--race); width: 120px; }
  .val { color: var(--text); min-width: 34px; font-variant-numeric: tabular-nums; }
  .races { display: flex; gap: 6px; }
  .races button { border: 1px solid var(--line); background: var(--bg); color: var(--dim); border-radius: 6px; padding: 6px 10px; cursor: pointer; text-transform: capitalize; font: inherit; }
  .races button.on { color: #000; font-weight: 600; }
  .races button[data-r=terran].on { background: var(--terran); border-color: var(--terran); }
  .races button[data-r=protoss].on { background: var(--protoss); border-color: var(--protoss); }
  .races button[data-r=zerg].on { background: var(--zerg); border-color: var(--zerg); }
  .races button[data-r=clean].on { background: var(--clean); border-color: var(--clean); }
  #go { margin-left: auto; background: var(--race); color: #000; border: 0; border-radius: 8px; padding: 11px 22px; font-weight: 700; font-size: 15px; cursor: pointer; min-width: 190px; }
  #go:disabled { opacity: .55; cursor: wait; }
  .fxgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .fx { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; opacity: .55; transition: opacity .15s; }
  .fx.on { opacity: 1; border-color: color-mix(in srgb, var(--race) 50%, var(--line)); }
  .fx header { all: unset; display: flex; align-items: center; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
  .fx .p { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); margin-top: 4px; }
  .fx .p span:first-child { width: 62px; }
  .fx .p input { flex: 1; width: auto; }
  .switch { position: relative; width: 34px; height: 18px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i { position: absolute; inset: 0; background: var(--line); border-radius: 9px; cursor: pointer; transition: .15s; }
  .switch i::after { content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + i { background: var(--race); }
  .switch input:checked + i::after { left: 18px; }
  canvas { width: 100%; height: 90px; display: block; background: var(--bg); border-radius: 6px; cursor: pointer; }
  .clips { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; max-height: 220px; overflow-y: auto; }
  .clip { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; background: var(--panel2); font-size: 13px; }
  .clip .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .tag { font-size: 11px; color: var(--dim); }
  .clip button, .clip a { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 5px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 12px; text-decoration: none; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 0 0 10px; display: flex; justify-content: space-between; }
  .hint { font-size: 12px; color: var(--dim); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { max-height: 40vh; } }
</style>
</head>
<body>
<header>
  <h1>OpenSlop II Voice Studio <small style="opacity:.6;font-weight:400;letter-spacing:0">v0.1.0</small></h1>
  <div id="status"><span class="dot"></span><span id="statusText">Loading voice model…</span></div>
</header>
<main>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div id="phrases"></div>
    <div class="aside-foot">
      <span>Click a line to load it</span>
      <label class="linkbtn">Import phrases<input type="file" id="import" accept=".json" hidden /></label>
    </div>
  </aside>
  <section class="work">
    <div class="card">
      <textarea id="text" placeholder="Type a line, or pick one on the left…"></textarea>
      <div class="row">
        <label class="f">Voice <select id="voice"></select></label>
        <label class="f">Speed <input type="range" id="speed" min="0.6" max="1.5" step="0.05" /><span class="val" id="speedVal"></span></label>
        <label class="f"><input type="checkbox" id="batch" /> One clip per line</label>
      </div>
      <div class="row">
        <div class="races" id="races"></div>
        <button id="go">Generate &amp; Play</button>
      </div>
      <div class="hint" style="margin-top:8px">⌘/Ctrl + Enter to generate. Changing only effects re-renders instantly, with no new speech generation.</div>
    </div>
    <div class="card">
      <h2>Effects</h2>
      <div class="fxgrid" id="fxgrid"></div>
    </div>
    <div class="card">
      <h2><span>Output</span><span id="clipInfo"></span></h2>
      <canvas id="wave" width="1200" height="180" title="Click to replay"></canvas>
      <div class="clips" id="clips"></div>
    </div>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
