<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preload" as="image" href="/ui/openslop_logo.webp" type="image/webp" fetchpriority="high" />
    <title>OpenSlop II</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/menu.css" />
    <style>html, body { margin: 0; background: #02060d; }</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@100;300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Title menu, painted from HTML + CSS before any JS loads; MainMenu.ts takes it over (and replays an early click) once the game code is in -->
    <div id="main-menu" class="main-menu sc2s home"><div class="bgfx base"></div><div class="bgfx haze"></div><div class="stage">
      <div class="logo" role="img" aria-label="OpenSlop II"><div class="lgimg"></div></div>
      <div class="homenav">
        <button class="sbtn" data-act="go" data-nav="versus" data-sub="ai">Single Player</button>
        <button class="sbtn" data-act="go" data-nav="versus" data-sub="1v1">Multiplayer</button>
        <div class="pcount"><i class="live"></i><button type="button" class="pc"><b>0</b> single player</button><button type="button" class="pc"><b>0</b> multiplayer</button></div>
        <button class="sbtn chat" data-act="attrib">Attributions</button>
      </div>
    </div></div>
    <script>
      document.getElementById('main-menu').addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('[data-act]');
        if (b) window.__bootClick = { act: b.dataset.act, nav: b.dataset.nav || '', sub: b.dataset.sub || '' };
      });
    </script>
    <div id="app">
      <!-- 3D Graphics Viewport -->
      <div id="canvas-container"></div>
      <!-- HUD Overlay -->
      <div id="ui-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
